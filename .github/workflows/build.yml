name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Diagnóstico do repositório
        run: |
          echo "=== Raiz ==="
          ls -la
          echo "=== Arquivos de build ==="
          ls -la settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties gradlew 2>/dev/null || true
          echo "=== app ==="
          ls -la app 2>/dev/null || echo "(sem pasta app)"

      - name: Gerar wrapper se faltar
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew ausente — gerando"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew 2>/dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
